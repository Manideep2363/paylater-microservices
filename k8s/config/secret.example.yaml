apiVersion: v1
kind: Secret
metadata:
  name: paylater-secret
  namespace: paylater
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "replace-with-a-strong-password"
  DB_PASSWORD: "replace-with-the-mysql-root-password"
  JWT_SECRET: "replace-with-a-long-random-jwt-secret"
  INTERNAL_API_TOKEN: "replace-with-a-long-random-internal-token"
  ADMIN_EMAIL: "replace-with-the-admin-email"
  ADMIN_PASSWORD: "replace-with-a-strong-admin-password"
